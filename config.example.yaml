  KCC:          {체크용: 'KCC',          갑지: '㈜KCC 글라스',   수불부: 'KCC글라스',    시험601: '㈜KCC글라스',    대장: 'KCC글라스'}
  한국파일:     {체크용: '한국파일',     갑지: '㈜한국파일',     수불부: '한국파일',     시험601: '한국파일㈜',     대장: '한국파일'}
  아주산업:     {체크용: '아주산업',     갑지: '아주산업㈜',     수불부: '아주산업',     시험601: '아주산업㈜',     대장: '아주산업'}
  동양파일:     {체크용: '동양파일',     갑지: '동양파일㈜',     수불부: '동양파일',     시험601: '동양파일㈜',     대장: '동양파일'}
  동진파일:     {체크용: '동진파일',     갑지: '동진파일㈜',     수불부: '동진파일',     시험601: '동진파일㈜',     대장: '동진파일'}
  삼일씨엔에스: {체크용: '삼일씨엔에스', 갑지: '㈜삼일씨엔에스', 수불부: '삼일 C&S',     시험601: '㈜삼일C&S',      대장: '삼일C&S'}
  아이에스동서: {체크용: '아이에스동서', 갑지: '아이에스동서㈜', 수불부: '아이에스동서', 시험601: '아이에스동서㈜', 대장: '아이에스동서'}
  유정산업:     {체크용: '유정산업',     갑지: '유정산업㈜',     수불부: '유정산업',     시험601: '유정산업㈜',     대장: '유정산업'}

# =====================================================================
# 문서 투입 — 원본을 intake_root 에 넣으면 아래 규칙대로 갈라진다
#
#   압축분류  각종시험·자재검수 사진 -> 메타데이터 제거 + 압축 + 분류
#   원본분류  의뢰시험 증빙        -> 원본 그대로 보존 + 분류
#   성적서    성적서·보고서 PDF     -> 글자 추출 + 문서 자동 완성 + 분류
#
# ★ 읽기가 먼저, 압축이 나중이다. 카카오톡 사진은 이미 뭉개져 있으니
#   원본을 넣어야 하고, 프로그램은 원본에서 먼저 읽은 뒤 압축한다.
# =====================================================================
documents:
  # OCR 엔진 (선택). 비워 두면 설치된 것을 자동으로 찾는다.
  # 성적서 PDF 는 텍스트 레이어가 있어 OCR 없이 읽힌다 (진단 PART C §7).
  ocr_engine:            # rapidocr | easyocr | tesseract | (비움 = 자동)

  categories:
    # --- 압축분류: 우리가 찍은 현장 사진 ---
    - {name: 자재검수,   lane: 압축분류, folder_fmt: '%m%d',   require_sub: false,
       dest: '{quality_root}\00. 사진관리\자재검수\01.PHC파일'}
    - {name: PHC_겉모양, lane: 압축분류, folder_fmt: '%Y%m%d', require_sub: false,
       dest: '{quality_root}\Q. 각종시험\01.02 PHC파일 관련\1. 겉모양치수'}
    - {name: 시료채취,   lane: 압축분류, folder_fmt: '%Y%m%d', require_sub: false,
       dest: '{quality_root}\Q. 각종시험\사진\시료채취'}
    - {name: 물시멘트비, lane: 압축분류, folder_fmt: null,     require_sub: true,
       dest: '{quality_root}\Q. 각종시험\01.02 PHC파일 관련\2. 물시멘트비_사진'}
    - {name: BSCW,       lane: 압축분류, folder_fmt: null,     require_sub: true,
       dest: '{quality_root}\Q. 각종시험\03. 토목가시설 관련\BSCW'}
    - {name: JSP,        lane: 압축분류, folder_fmt: null,     require_sub: true,
       dest: '{quality_root}\Q. 각종시험\03. 토목가시설 관련\JSP'}

    # --- 원본분류: 외부 기관 증빙. 손대지 않는다 ---
    - {name: 의뢰시험_재하, lane: 원본분류, folder_fmt: null, require_sub: true,
       dest: '{quality_root}\N. 의뢰시험\03. 의뢰시험 사진\06. 재하'}
    - {name: 의뢰시험_MT,   lane: 원본분류, folder_fmt: null, require_sub: true,
       dest: '{quality_root}\N. 의뢰시험\03. 의뢰시험 사진\05. MT'}
    - {name: 의뢰시험_일반, lane: 원본분류, folder_fmt: '%Y%m%d', require_sub: false,
       dest: '{quality_root}\N. 의뢰시험\03. 의뢰시험 사진'}

    # --- 성적서: 글자를 뽑아 문서를 채운 뒤 분류 ---
    - {name: 성적서_재하, lane: 성적서, folder_fmt: null, require_sub: false,
       ledger: ledger_load_mt,
       dest: '{quality_root}\N. 의뢰시험\02. 의뢰시험 성적서'}
    - {name: 성적서_MT,   lane: 성적서, folder_fmt: null, require_sub: false,
       ledger: ledger_load_mt,
       dest: '{quality_root}\N. 의뢰시험\02. 의뢰시험 성적서'}
    - {name: 성적서_생산, lane: 성적서, folder_fmt: null, require_sub: false,
       dest: '{quality_root}\O. PC 생산 시험성적서'}
    - {name: 성적서_의뢰, lane: 성적서, folder_fmt: null, require_sub: false,
       ledger: ledger_outsrc,
       dest: '{quality_root}\N. 의뢰시험\02. 의뢰시험 성적서'}
    - {name: 송장,        lane: 성적서, folder_fmt: '%Y%m%d', require_sub: false,
       dest: '{quality_root}\G. 자재\04. 자재수불부\송장_파일'}

# --- PART 3 사진 분류기 (§24.2) ---
photo:
  max_edge: 1600
  jpeg_quality: 85
  backup_keep_days: 30
  ignore_names: ['Thumbs.db', 'desktop.ini', '.DS_Store']
  extensions: ['.jpg', '.jpeg', '.png', '.heic', '.heif']
  categories:
    - {name: 자재검수,    dest: '{quality_root}\00. 사진관리\자재검수\01.PHC파일',            folder_fmt: '%m%d',   require_sub: false}
    - {name: PHC_겉모양,  dest: '{quality_root}\Q. 각종시험\01.02 PHC파일 관련\1. 겉모양치수', folder_fmt: '%Y%m%d', require_sub: false}
    - {name: 시료채취,    dest: '{quality_root}\Q. 각종시험\사진\시료채취',                    folder_fmt: '%Y%m%d', require_sub: false}
    - {name: 물시멘트비,  dest: '{quality_root}\Q. 각종시험\01.02 PHC파일 관련\2. 물시멘트비_사진', folder_fmt: null, require_sub: true}
    - {name: BSCW,        dest: '{quality_root}\Q. 각종시험\03. 토목가시설 관련\BSCW',          folder_fmt: null,     require_sub: true}
    - {name: JSP,         dest: '{quality_root}\Q. 각종시험\03. 토목가시설 관련\JSP',           folder_fmt: null,     require_sub: true}

# 구버전 사진 분류 대상 (§6.3) — inbox 최상위 파일을 카테고리로 보내는 단순 이동
photo_categories:
  - {label: '자재검수 / PHC파일', dest: '{quality_root}\00. 사진관리\자재검수\01.PHC파일'}
  - {label: '자재검수 / 레미콘',  dest: '{quality_root}\00. 사진관리\레미콘'}
  - {label: '송장 (자재수불부)',  dest: '{quality_root}\G. 자재\04. 자재수불부\송장_파일', date_fmt: '%Y%m%d'}
  - {label: '시험기기',           dest: '{quality_root}\L. 시험기자재'}
  - {label: 'PHC 불량자재',       dest: '{quality_root}\M. 부적합'}

defaults:
  채취장소:     '야적장'
  밀크_시공업체: '이산지반건설'
  밀크_채취장소: '현장 내'
  토목_시공업체: '한성토건'
  토목_채취장소: '현장 내'
  첨부물:       '■ 출하송장, ■ 사진대지 등'
