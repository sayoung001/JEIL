name: 자재검수 회차 생성
auto:
  - 백업 (개인\클로드 자동 연동\{날짜})
  - ★수불부 체크용 행 추가
  - 갑지 신규 회차 블록 생성 + 인쇄영역 이동
  - 자재수불부 행 추가
  - 사진대지 시트 생성 (반입일 기입까지)
manual:
  - id: photo_paste
    text: "사진대지 {날짜} 시트에 송장 사진 4장 붙이기"
    hint: "원본은 사진_품질_임시 또는 04. 자재수불부\\송장_파일\\{YYYYMMDD}"
  - id: photo_gallery
    text: "자재검수 사진대지.xlsx 에 현장 검수 사진 붙이기"
    hint: "00. 사진관리\\자재검수\\01.PHC파일\\{MMDD} 폴더"
  - id: print_pdf
    text: "갑지 인쇄 → PDF 저장"
    hint: "03. 자재검수요청서\\자재검수요청서_발송\\파일 QG03-{차수} {YYMMDD}.pdf"
  - id: send
    text: "감리단 발송 (요청서 + 출하송장 + 사진대지)"
  - id: scan_back
    text: "감리 서명본 회수 후 스캔 저장"
    hint: "03. 자재검수요청서\\자재검수요청서_감리_스캔\\건축\\"
  - id: mark_done
    text: "★수불부 체크용 L열 '완' 확인"
