name: PHC 밀크 / 물시멘트비 시험 (Q-Q-01)
auto:
  - 백업
  - 612 `양식` → 회차 시트 복제 + 숫자 6개 기입
  - 612 짝 `사진대지 (N)` 시트 복제
  - 612 대장 1행 추가
  - Q-01,02 실시대장 2행 그룹 추가
manual:
  - id: photo
    text: "사진분류\\물시멘트비\\{회차} 폴더에 사진 넣고 [사진 분류] 실행"
    hint: "폴더명은 날짜가 아니라 612 시트 번호(01, 02, 03)다"
  - id: photo_paste
    text: "612 `사진대지 ({회차})` 시트에 사진 붙이기"
  - id: print_pdf
    text: "일지 인쇄 → PDF 저장"
  - id: send
    text: "감리단 확인·서명"
