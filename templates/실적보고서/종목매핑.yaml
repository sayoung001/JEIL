# 실시대장 1건 -> 월간 실적보고서 몇 번째 줄로 셀 것인가
#
# ★ 겉모양·치수 시험 1건은 보고서에서 두 줄로 잡힌다.
#   진단 §10 실측(8월: 겉모양 4건, 치수 4건)이 이를 보여 준다.
#   시험은 4번 했는데 보고서 항목은 두 개라 각각 4건이 된다.
#
# 새 시험이 생기면 코드가 아니라 여기에 한 줄 추가한다.
# 규칙에 안 걸린 건은 조용히 빠지지 않고 경고로 보고된다.

매핑:
  # --- 현장시험 (Q-01,02) ---
  - 계열: Q-Q-02
    종목: ['겉모양 및 모양', '치수']      # 시험 1건 = 보고서 2줄
  - 계열: Q-Q-01
    종목: '물시멘트비(W/C)'

  # --- 현장시험 토목 (Q-03) ---
  - 계열: Q-Q-03
    종목: 'BSCW 압축강도'
  - 계열: Q-Q-04
    종목: 'JSP 압축강도'

  # --- 재하·MT (O-01,04) — 시트 이름으로 가른다 ---
  - 시트: 재하시험
    종목: '동재하시험'
  - 시트: MT검사
    종목: '용접부 비파괴검사'

  # --- 의뢰시험 (N-02) — 대상재료로 가른다 ---
  - 대상재료: H형강
    종목: 'H형강 말뚝'
  - 대상재료: 성토용
    종목: '성토용 흙'
  - 대상재료: 건설오니
    종목: '건설오니'
  - 대상재료: 방류수
    종목: '방류수'
